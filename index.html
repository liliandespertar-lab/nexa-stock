<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA STOCK | Gestão de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .view-section { display: none; } .view-section.active { display: block; }
        .input-nexa { border-radius: 1rem; border: 1px solid #e2e8f0; padding: 0.85rem 1rem; width: 100%; outline: none; transition: 0.2s; }
        .input-nexa:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .modal-nexa { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); }
    </style>
</head>
<body class="min-h-screen">

    <div id="screen-app" class="flex-1 flex flex-col w-full h-full">
        <div id="modal-edit-prod" class="hidden fixed inset-0 z-50 modal-nexa flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-2xl p-8 rounded-[2rem] shadow-2xl relative">
                <button onclick="document.getElementById('modal-edit-prod').classList.add('hidden')" class="absolute top-6 right-6 text-2xl">&times;</button>
                <h2 class="text-2xl font-black mb-6">✏️ Editar Produto</h2>
                <form id="form-edit-prod" class="space-y-4">
                    <input type="hidden" id="edit-prod-id-original">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-black uppercase block mb-1">Código do Material</label>
                            <input type="text" id="edit-prod-cod" class="input-nexa border-indigo-500 font-bold" required placeholder="Novo Código">
                        </div>
                        <div>
                            <label class="text-[10px] font-black uppercase block mb-1">Nome do Material</label>
                            <input type="text" id="edit-prod-nome" class="input-nexa border-indigo-500" required>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="edit-prod-local" class="input-nexa" placeholder="Local">
                        <input type="text" id="edit-prod-setor" class="input-nexa" placeholder="Setor">
                    </div>
                    <button type="submit" id="btn-salvar-edit-prod" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black mt-4 hover:bg-indigo-700 transition">SALVAR ALTERAÇÕES</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyA4RvrOh5EU6OXj1zbNB1hGwWDj9VNG-T4", projectId: "nexa-stock", storageBucket: "nexa-stock.firebasestorage.app", appId: "1:343344768621:web:db46a3c2a353ff65964164" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        
        // Função chamada para abrir o modal de edição
        window.abrirEditProd = (id) => {
            // window.bancoProdutos deve estar populado no seu sistema
            const p = window.bancoProdutos.find(x => x.id === id);
            if(!p) return;
            
            // Preencher inputs
            document.getElementById('edit-prod-id-original').value = p.id;
            document.getElementById('edit-prod-cod').value = p.id; // Editável
            document.getElementById('edit-prod-nome').value = p.nome || ''; // Editável
            document.getElementById('edit-prod-local').value = p.local || '';
            document.getElementById('edit-prod-setor').value = p.setor || '';
            
            document.getElementById('modal-edit-prod').classList.remove('hidden');
        };

        // Lógica de Salvamento e Re-indexação
        document.getElementById('form-edit-prod').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-edit-prod');
            btn.disabled = true;
            btn.innerText = "SALVANDO...";

            const idOriginal = document.getElementById('edit-prod-id-original').value;
            const novoCod = document.getElementById('edit-prod-cod').value.trim().replace(/\//g, '-');
            const novoNome = document.getElementById('edit-prod-nome').value.trim();
            const novoLocal = document.getElementById('edit-prod-local').value.trim();
            const novoSetor = document.getElementById('edit-prod-setor').value.trim();

            try {
                const docRefOld = doc(db, "empresas", window.userEmpresa, 'produtos', idOriginal);
                
                if (novoCod !== idOriginal) {
                    // MODO RE-INDEXAÇÃO: O código mudou
                    const snap = await getDoc(docRefOld);
                    const dadosAtuais = snap.data();

                    // 1. Criar novo documento com o novo ID
                    await setDoc(doc(db, "empresas", window.userEmpresa, 'produtos', novoCod), {
                        ...dadosAtuais,
                        id: novoCod,
                        nome: novoNome,
                        local: novoLocal,
                        setor: novoSetor
                    });

                    // 2. Excluir o antigo
                    await deleteDoc(docRefOld);
                    
                    alert('Código alterado e produto re-indexado com sucesso!');
                } else {
                    // MODO ATUALIZAÇÃO SIMPLES: Apenas o nome ou dados mudaram
                    await updateDoc(docRefOld, {
                        nome: novoNome,
                        local: novoLocal,
                        setor: novoSetor
                    });
                    
                    alert('Produto atualizado com sucesso!');
                }
                
                document.getElementById('modal-edit-prod').classList.add('hidden');
                // Adicione aqui a chamada para recarregar sua lista, ex: carregarProdutos();
                
            } catch (err) {
                alert('Erro ao salvar no banco: ' + err.message);
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "SALVAR ALTERAÇÕES";
            }
        });
    </script>
</body>
</html>
