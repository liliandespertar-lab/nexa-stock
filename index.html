<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA STOCK | Gestão de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" href="https://firebasestorage.googleapis.com/v0/b/nexa-stock.firebasestorage.app/o/IMAGEM%20ICONE.png?alt=media&token=abe10eba-74c6-4e82-83d2-7fb0e25ddd3f">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass-login { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .nav-item { padding: 0.5rem 1rem; border-radius: 0.75rem; color: #94a3b8; font-weight: 600; font-size: 0.875rem; transition: all 0.2s; cursor: pointer; }
        .nav-item.active { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .input-nexa { border-radius: 1rem; border: 1px solid #e2e8f0; padding: 0.85rem 1rem; width: 100%; transition: all 0.2s; }
        .input-nexa:focus { border-color: #6366f1; outline: none; }
        .table-nexa th { background: #f8fafc; padding: 1rem; text-align: left; font-size: 0.7rem; text-transform: uppercase; color: #64748b; }
        .table-nexa td { padding: 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        .dropdown-nexa { max-height: 200px; overflow-y: auto; position: absolute; z-index: 50; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; display: none; }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen">

    <!-- TELA DE LOGIN -->
    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-[#0f172a] flex-col">
        <div class="w-full max-w-md glass-login p-10 rounded-[2.5rem] shadow-2xl border border-white/10">
            <div class="text-center mb-8">
                <img src="https://firebasestorage.googleapis.com/v0/b/nexa-stock.firebasestorage.app/o/IMAGEM%20ICONE.png?alt=media&token=abe10eba-74c6-4e82-83d2-7fb0e25ddd3f" class="h-20 mx-auto mb-4">
                <h1 class="text-3xl font-black text-white text-center italic uppercase">NEXA <span class="text-indigo-400">STOCK</span></h1>
                <p class="text-slate-400 text-xs mt-2 uppercase tracking-widest">Gestão de Estoque</p>
            </div>
            <form id="form-login" class="space-y-4">
                <input type="email" id="log-email" placeholder="E-mail" class="input-nexa bg-white/5 text-white border-white/10" required>
                <input type="password" id="log-pass" placeholder="Senha" class="input-nexa bg-white/5 text-white border-white/10" required>
                <button type="submit" class="w-full btn-gradient text-white py-4 rounded-2xl font-black">ENTRAR NO SISTEMA</button>
            </form>
        </div>
    </div>

    <!-- TELA DO ERP -->
    <div id="screen-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-[#0f172a] text-white p-4 flex justify-between items-center shadow-lg sticky top-0 z-40">
            <div class="flex items-center gap-4">
                <img src="https://firebasestorage.googleapis.com/v0/b/nexa-stock.firebasestorage.app/o/IMAGEM%20ICONE.png?alt=media&token=abe10eba-74c6-4e82-83d2-7fb0e25ddd3f" class="h-8">
                <nav class="flex gap-2">
                    <button onclick="changeView('dashboard')" id="nav-dashboard" class="nav-item">Dashboard</button>
                    <button onclick="changeView('operacoes')" id="nav-operacoes" class="nav-item">Operações</button>
                    <button onclick="changeView('movimentacoes')" id="nav-movimentacoes" class="nav-item active">Movimentações</button>
                    <button onclick="changeView('requisicoes')" id="nav-requisicoes" class="nav-item">Requisições</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <a href="tutorial.html" target="_blank" class="text-indigo-400 font-bold text-sm hover:text-white transition">Ajuda</a>
                <button onclick="fazerLogout()" class="text-rose-400 font-bold text-sm">Sair</button>
            </div>
        </header>

        <div id="view-dashboard" class="view-section p-8">
            <h2 class="text-2xl font-black text-slate-800 mb-6">Dashboard</h2>
            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div>
        </div>

        <div id="view-operacoes" class="view-section p-8">
            <h2 class="text-2xl font-black text-slate-800 mb-6">Operações</h2>
            <!-- Conteúdo de Operações -->
        </div>

        <div id="view-movimentacoes" class="view-section active p-8">
            <h2 class="text-2xl font-black text-slate-800 mb-6">Movimentações</h2>
            <table class="table-nexa w-full bg-white rounded-xl shadow-sm border border-slate-200">
                <thead>
                    <tr>
                        <th>DATA/HORA</th>
                        <th>TIPO</th>
                        <th>CÓD. PRODUTO</th>
                        <th>NOME</th>
                        <th>QUANT</th>
                        <th>LOCAL</th>
                        <th>SETOR</th>
                        <th>FORNECEDOR</th>
                        <th>RESPONSÁVEL</th>
                        <th>FINALIDADE</th>
                        <th>OBSERVAÇÕES</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="grid-mov"></tbody>
            </table>
        </div>

        <div id="view-requisicoes" class="view-section p-8">
            <h2 class="text-2xl font-black text-slate-800 mb-6">Requisições</h2>
            <!-- Conteúdo de Requisições -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4RvrOh5EU6OXj1zbNB1hGwWDj9VNG-T4",
            projectId: "nexa-stock",
            appId: "1:343344768621:web:db46a3c2a353ff65964164"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Core Functions
        window.changeView = (v) => {
            document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById(`nav-${v}`).classList.add('active');
        };

        window.fazerLogout = () => signOut(auth);

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-app').classList.remove('hidden');
            } else {
                document.getElementById('screen-login').classList.remove('hidden');
                document.getElementById('screen-app').classList.add('hidden');
            }
        });

        document.getElementById('form-login').onsubmit = async (e) => {
            e.preventDefault();
            await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
        };
    </script>
</body>
</html>
