<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/nexa-stock.firebasestorage.app/o/IMAGEM%20ICONE.png?alt=media&token=abe10eba-74c6-4e82-83d2-7fb0e25ddd3f">
    <title>NEXA STOCK | Gestão de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .bg-nexa { background: radial-gradient(circle at top right, #2e1065, #0f172a); }
        .glass-login { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }
        
        .nav-item { padding: 0.5rem 1rem; border-radius: 0.75rem; color: #94a3b8; font-weight: 600; font-size: 0.875rem; transition: all 0.2s; cursor: pointer; }
        .nav-item.active { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

        .modal-nexa { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); }
        .glass-form { background: white; border-radius: 2rem; max-height: 90vh; overflow-y: auto; }
        .input-nexa { border-radius: 1rem; border: 1px solid #e2e8f0; padding: 0.85rem 1rem; width: 100%; outline: none; }
        .table-nexa th { background: #f8fafc; padding: 1rem; font-size: 0.75rem; text-transform: uppercase; color: #64748b; }
        .table-nexa td { padding: 1rem; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
    </style>
</head>
<body class="min-h-screen">

    <div id="screen-login" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-nexa flex-col">
        <div class="w-full max-w-md glass-login p-10 rounded-[2.5rem] shadow-2xl">
            <h1 class="text-3xl font-black text-white text-center mb-8 italic uppercase">NEXA <span class="text-indigo-400">STOCK</span></h1>
            <form id="form-login" class="space-y-4">
                <input type="email" id="log-email" placeholder="E-mail" class="input-nexa bg-white/5 text-white" required>
                <input type="password" id="log-pass" placeholder="Senha" class="input-nexa bg-white/5 text-white" required>
                <button type="submit" class="w-full btn-gradient text-white py-4 rounded-2xl font-black">ENTRAR NO SISTEMA</button>
            </form>
        </div>
    </div>

    <div id="screen-app" class="hidden min-h-screen flex flex-col">
        <header class="bg-[#0f172a] text-white p-4 flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-black italic uppercase">NEXA <span class="text-indigo-400">STOCK</span></h1>
                <nav class="flex gap-2">
                    <button onclick="changeView('dashboard')" id="nav-dashboard" class="nav-item active">Dashboard</button>
                    <button onclick="changeView('operacoes')" id="nav-operacoes" class="nav-item">Operações</button>
                    <button onclick="changeView('movimentacoes')" id="nav-movimentacoes" class="nav-item">Movimentações</button>
                    <button onclick="changeView('requisicoes')" id="nav-requisicoes" class="nav-item">Requisições</button>
                </nav>
            </div>
            <button onclick="fazerLogout()" class="text-rose-400">Sair</button>
        </header>

        <div id="view-dashboard" class="view-section active p-8">
            <div id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>
        
        <!-- Other views would go here in full implementation -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc, writeBatch, increment, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4RvrOh5EU6OXj1zbNB1hGwWDj9VNG-T4",
            authDomain: "nexa-stock.firebaseapp.com",
            projectId: "nexa-stock",
            storageBucket: "nexa-stock.firebasestorage.app",
            messagingSenderId: "343344768621",
            appId: "1:343344768621:web:db46a3c2a353ff65964164"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.bancoProdutos = [];
        window.userEmpresa = "J_Shayeb"; // Simplificado para exemplo

        async function carregarProdutos() {
            const snap = await getDocs(collection(db, "empresas", window.userEmpresa, "produtos"));
            window.bancoProdutos = [];
            snap.forEach(d => window.bancoProdutos.push({id: d.id, ...d.data()}));
            renderizarDashboard();
        }

        function renderizarDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const total = window.bancoProdutos.length;
            const criticos = window.bancoProdutos.filter(p => (p.saldo||0) <= (p.estoqueMinimo||0)).length;
            const duplicados = verificarDuplicidade();
            const semCodigos = window.bancoProdutos.filter(p => !p.id || p.id === '...' || p.id.trim() === '');
            
            grid.innerHTML = `
                <div class="p-8 bg-white rounded-3xl border shadow-sm">
                    <p class="text-xs font-black text-slate-400">TOTAL DE PRODUTOS</p>
                    <p class="text-4xl font-black">${total}</p>
                </div>
                <div onclick="abrirAlertaCriticos()" class="p-8 bg-rose-50 rounded-3xl border border-rose-100 cursor-pointer">
                    <p class="text-xs font-black text-rose-500">ALERTA ESTOQUE MÍNIMO</p>
                    <p class="text-4xl font-black text-rose-700">${criticos}</p>
                </div>
                <div onclick="changeView('movimentacoes')" class="p-8 bg-indigo-50 rounded-3xl border border-indigo-100 cursor-pointer">
                    <p class="text-xs font-black text-indigo-500">MOVIMENTAÇÕES</p>
                    <p class="text-4xl font-black text-indigo-700">Acessar</p>
                </div>
            `;
        }

        function verificarDuplicidade() {
            // Lógica robusta de duplicidade por código ou nome normalizado
            const seen = new Map();
            const dups = [];
            window.bancoProdutos.forEach(p => {
                const key = (p.id || '').toLowerCase().trim();
                const nameKey = (p.nome || '').toLowerCase().trim();
                if(seen.has(key) || seen.has(nameKey)) dups.push(p);
                seen.set(key, true);
                seen.set(nameKey, true);
            });
            return dups;
        }

        window.changeView = (v) => {
            document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
            document.getElementById(`view-${v}`).classList.add('active');
            document.getElementById(`nav-${v}`).classList.add('active');
        };

        window.fazerLogout = () => signOut(auth);

        onAuthStateChanged(auth, u => {
            if(u) {
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-app').classList.remove('hidden');
                carregarProdutos();
            } else {
                document.getElementById('screen-login').classList.remove('hidden');
                document.getElementById('screen-app').classList.add('hidden');
            }
        });

        document.getElementById('form-login').onsubmit = async (e) => {
            e.preventDefault();
            await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
        };
    </script>
</body>
</html>
